# yaml-language-server: $schema=../../schemas/dataflow-config.schema.json
#
# Long-running streaming jobs from Google-provided Flex Templates:
#   - orders-to-bigquery   Pub/Sub subscription to BigQuery, dead-letter table,
#                          Streaming Engine, autoscaling up to 20 workers
#   - clicks-to-gcs        Pub/Sub topic to 5-minute text files in Cloud Storage
#   - audit-to-bigquery    the same template pinned to a release, in another
#                          region, updated in place with a transform mapping
#
# Streaming jobs keep running. On terraform destroy (or when a change needs a
# new job) they are drained by default here, so in-flight data is processed.

defaults:
  region: europe-west1
  labels:
    team: data-platform
    kind: streaming
  jobs:
    service_account_email: dataflow-streaming@${project_id}.iam.gserviceaccount.com
    temp_location: gs://${project_id}-dataflow/tmp
    staging_location: gs://${project_id}-dataflow/staging
    enable_streaming_engine: true
    on_delete: drain
    machine_type: n2-standard-2
    max_workers: 10

jobs:
  orders-to-bigquery:
    google_template:
      name: PubSub_to_BigQuery_Flex
    parameters:
      inputSubscription: projects/${project_id}/subscriptions/orders-dataflow
      outputTableSpec: ${project_id}:sales.orders_raw
      outputDeadletterTable: ${project_id}:sales.orders_deadletter
    max_workers: 20
    num_workers: 2

  clicks-to-gcs:
    google_template:
      name: Cloud_PubSub_to_GCS_Text_Flex
    parameters:
      inputTopic: projects/${project_id}/topics/clicks
      outputDirectory: gs://${project_id}-clickstream/raw/
      outputFilenamePrefix: clicks-
      outputFilenameSuffix: .json
      windowDuration: 5m
    machine_type: n2-standard-4
    labels:
      pii: "false"

  audit-to-bigquery:
    region: us-central1
    google_template:
      name: PubSub_to_BigQuery_Flex
      version: 2026-09-15-00_RC00
    parameters:
      inputTopic: projects/${project_id}/topics/audit-events
      outputTableSpec: ${project_id}:security.audit_events
    # Renamed transforms keep their state when the job is updated in place.
    transform_name_mapping:
      ReadPubSubTopic: ReadAuditEvents
    additional_experiments: [enable_streaming_engine_resource_based_billing]
