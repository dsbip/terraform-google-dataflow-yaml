# Runs tests/integration in a real project (a small streaming job and,
# optionally, a paused Data Pipeline), checks that a second plan is empty,
# updates in place, and destroys everything again. Runs only on demand.
#
# Setup (repository settings > Secrets and variables > Actions > Variables):
#   DF_YAML_TEST_PROJECT            project to test in (Dataflow, Pub/Sub and
#                                   Cloud Storage APIs; Data Pipelines and Cloud
#                                   Scheduler for the pipeline)
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_SERVICE_ACCOUNT             service account with roles/dataflow.admin,
#                                   roles/storage.admin, roles/pubsub.admin,
#                                   roles/iam.serviceAccountUser and
#                                   roles/datapipelines.admin
name: Live test

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to run in
        default: europe-west1
      pipelines:
        description: Also test a paused Data Pipeline
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  live:
    runs-on: ubuntu-latest
    if: vars.DF_YAML_TEST_PROJECT != ''
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/python/requirements.txt
      - run: python -m pytest tests/python/test_live.py -v
        env:
          DF_YAML_TEST_PROJECT: ${{ vars.DF_YAML_TEST_PROJECT }}
          DF_YAML_TEST_REGION: ${{ inputs.region }}
          DF_YAML_TEST_PIPELINES: ${{ inputs.pipelines }}
